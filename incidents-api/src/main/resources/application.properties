spring.application.name=incidents-api
server.port=8080

spring.profiles.default=dev
spring.datasource.url=jdbc:h2:mem:incidentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Secret de développement uniquement. En production, définir JWT_SECRET avec au moins 32 caractères.
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:300000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origin=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false
